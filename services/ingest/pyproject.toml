[project]
name = "polyplastic-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0,<0.1",
    "python-pptx>=1.0,<1.1",
    "python-docx>=1.1,<1.2",
    "pillow>=11,<12",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7,<8",
    "respx>=0.23,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
